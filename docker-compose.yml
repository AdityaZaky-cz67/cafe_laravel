# ============================================================
#  Brewly Coffee — Docker Compose
#  Services: app (PHP-FPM) + webserver (Nginx) + db (MySQL)
# ============================================================

services:

  # ----------------------------------------------------------
  # SERVICE 1: PHP-FPM Laravel App
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: brewly-coffee:latest
    container_name: brewly_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    env_file:
      - .env.docker
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    networks:
      - brewly_network
    depends_on:
      db:
        condition: service_healthy
        healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000", "||", "exit", "1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s

  # ----------------------------------------------------------
  # SERVICE 2: Nginx Web Server
  # ----------------------------------------------------------
  webserver:
    image: nginx:1.25-alpine
    container_name: brewly_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - brewly_network
    depends_on:
      app:
        condition: service_healthy

  # ----------------------------------------------------------
  # SERVICE 3: MySQL Database
  # ----------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: brewly_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-brewly_coffee}
      MYSQL_USER: ${DB_USERNAME:-brewly_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-brewly_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - brewly_db_data:/var/lib/mysql
    networks:
      - brewly_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # SERVICE 4: phpMyAdmin (opsional)
  # ----------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: brewly_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    networks:
      - brewly_network
    depends_on:
      - db
    profiles:
      - debug

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  brewly_network:
    driver: bridge

# ----------------------------------------------------------
# Volumes (persistent data)
# ----------------------------------------------------------
volumes:
  brewly_db_data:
    driver: local
