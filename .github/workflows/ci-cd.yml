# ============================================================
#  Brewly Coffee — CI/CD Pipeline dengan Docker
#  Self-Hosted Runner (Windows Local Laptop)
# ============================================================
#
#  Alur Pipeline:
#  1. Trigger: push ke branch main/develop atau pull request
#  2. Job: build-and-test → Build Docker image + jalankan PHPUnit
#  3. Job: deploy → docker-compose up dengan image terbaru
#  4. Job: notify → laporan status pipeline
# ============================================================

name: Brewly Coffee CI/CD (Docker)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: brewly-coffee
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================
  # JOB 1: BUILD DOCKER IMAGE & TEST
  # ============================================================
  build-and-test:
    name: 🐳 Build & Test (Docker)
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🔍 Cek versi Docker
        run: |
          docker --version
          docker compose version

      - name: 🏗️ Build Docker test image
        run: |
          docker build --build-arg INSTALL_DEV=true -t "$($env:IMAGE_NAME):$($env:IMAGE_TAG)" -t "$($env:IMAGE_NAME):test" -f Dockerfile .

      - name: 🧪 Jalankan PHPUnit tests (dalam container)
        run: |
          docker run --rm -e APP_ENV=testing "$($env:IMAGE_NAME):test" php artisan test

      - name: 🔍 Validasi Routes & Framework
        run: |
          docker run --rm "$($env:IMAGE_NAME):test" php artisan route:list

      - name: 🏗️ Build Docker production image
        run: |
          docker build -t "$($env:IMAGE_NAME):latest" -f Dockerfile .

      - name: 📊 Info Docker image
        run: |
          Write-Host "=================================================="
          Write-Host "  Image Tag : $($env:IMAGE_NAME):$($env:IMAGE_TAG)"
          Write-Host "  Latest    : $($env:IMAGE_NAME):latest"
          docker images | Select-String "brewly-coffee"
          Write-Host "=================================================="

  # ============================================================
  # JOB 2: DEPLOY — Hanya branch main
  # Menjalankan docker-compose di laptop lokal
  # ============================================================
  deploy:
    name: 🚀 Deploy (docker-compose up)
    runs-on: self-hosted
    needs: build-and-test
    timeout-minutes: 20
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: http://localhost:8080

    steps:
      - name: 📥 Checkout kode terbaru
        uses: actions/checkout@v4

      - name: ⚙️ Siapkan environment produksi
        run: |
          if (!(Test-Path .env)) {
              Copy-Item .env.docker .env
              Write-Host "Disalin .env dari .env.docker"
          } else {
              Write-Host ".env sudah tersedia."
          }

      - name: 🛑 Stop dan Hapus container lama yang tersangkut
        run: |
          Write-Host "Menghentikan dan menghapus container lama dari sistem..."
          
          # Hapus container secara individu jika ada
          if (docker ps -a -q --filter "name=brewly_db") { docker rm -f brewly_db }
          if (docker ps -a -q --filter "name=brewly_app") { docker rm -f brewly_app }
          if (docker ps -a -q --filter "name=brewly_nginx") { docker rm -f brewly_nginx }
          
          # Lakukan down via compose untuk membersihkan network sisa
          docker compose down --remove-orphans

      - name: 🚀 Jalankan container baru
        run: |
          docker compose up -d --build --wait
          Write-Host "✅ Semua container siap dan healthy!"

      - name: ✅ Verifikasi status container
        run: |
          docker compose ps
          Write-Host ""
          Write-Host "Status container app:"
          docker compose exec -T app php artisan --version

      - name: 🌐 Verifikasi HTTP endpoint
        run: |
          try {
              $response = Invoke-WebRequest -Uri "http://localhost:8080" -UseBasicParsing -TimeoutSec 15
              Write-Host "HTTP Status: $($response.StatusCode)"
              if ($response.StatusCode -eq 200) {
                  Write-Host "✅ Endpoint http://localhost:8080 aktif dan merespon 200 OK"
              }
          } catch {
              Write-Host "⚠️ Warning cek endpoint: $_"
          }

      - name: 🎉 Deploy berhasil!
        run: |
          Write-Host "=================================================="
          Write-Host "  🚀 Brewly Coffee berhasil di-deploy!"
          Write-Host "  URL     : http://localhost:8080"
          Write-Host "  Branch  : ${{ github.ref_name }}"
          Write-Host "  Commit  : ${{ github.sha }}"
          Write-Host "  Waktu   : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "=================================================="

      - name: 🧹 Bersihkan image Docker lama
        if: always()
        run: |
          docker image prune -f --filter "until=24h"

  # ============================================================
  # JOB 3: NOTIFIKASI
  # ============================================================
  notify:
    name: 📢 Laporan Pipeline
    runs-on: self-hosted
    needs: [build-and-test, deploy]
    if: always()

    steps:
      - name: 📊 Status Pipeline
        run: |
          Write-Host "=================================================="
          Write-Host "  📊 Brewly Coffee — Laporan CI/CD"
          Write-Host "  Build & Test : ${{ needs.build-and-test.result }}"
          Write-Host "  Deploy       : ${{ needs.deploy.result }}"
          Write-Host "  Branch       : ${{ github.ref_name }}"
          Write-Host "  Commit       : ${{ github.sha }}"
          Write-Host "  Pelaku       : ${{ github.actor }}"
          Write-Host "  Waktu        : $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host "=================================================="

      - name: 🐳 Info Docker yang berjalan
        if: needs.deploy.result == 'success'
        run: |
          docker compose ps